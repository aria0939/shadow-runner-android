name: Android APK Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Shadow Runner APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build web assets (Vite production)
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK (unsigned)
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Rename APK
        run: |
          mkdir -p artifacts
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "artifacts/Shadow-Runner-v1.0.0-debug.apk"
          fi
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "artifacts/Shadow-Runner-v1.0.0-release-unsigned.apk"
          fi
          ls -la artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadow-runner-apk
          path: artifacts/*.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: shadow-runner-apk
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Shadow Runner ${{ github.ref_name }}"
          body: |
            # Shadow Runner: Pixel Adventure — ${{ github.ref_name }}

            Premium 2D cinematic pixel-art action platformer for Android.

            ## Installation
            1. Download the APK file below
            2. Allow installation from unknown sources in Android settings
            3. Open the APK file to install
            4. Launch **Shadow Runner** from your app drawer

            ## Build type
            - Debug builds are signed with the debug key (suitable for testing)
            - Release builds are unsigned — sign with your own keystore before distribution

            ## Requirements
            - Android 7.0 (API 24) or later
            - Landscape orientation (auto-rotates if needed)
          files: |
            artifacts/Shadow-Runner-v1.0.0-debug.apk
            artifacts/Shadow-Runner-v1.0.0-release-unsigned.apk
          draft: false
          prerelease: false
